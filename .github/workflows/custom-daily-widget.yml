name: Build Custom Daily Widget APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Apply custom daily-note patch
        run: python3 .github/scripts/patch_daily.py

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'

      - name: Build APK
        run: gradle assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Obsidian-Daily-Widget-Flo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Obsidian-Daily-Widget-Flo
          path: Obsidian-Daily-Widget-Flo.apk
          if-no-files-found: error
